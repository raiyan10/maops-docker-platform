# Pinned supply-chain scanner container images for maops-docker-platform.
#
# KEY=value, shell-sourceable (Makefile) and Python-parseable
# (scripts/security/*.py). Every reference here MUST be an exact,
# immutable `tag@sha256:<64 hex>` digest reference - never a bare tag,
# never `latest`. Updating a pin is an explicit, reviewed repository
# change (see docs/build-security.md / docs/supply-chain.md), never an
# automatic "latest available" resolution at `make` time.
#
# Resolved for real against the live Docker Hub registry on 2026-08-20:
#   docker pull anchore/syft:v1.51.0  -> confirmed same digest as :latest
#     that day (Syft 1.51.0, the current stable release at pin time)
#   docker pull aquasec/trivy:0.74.0  -> confirmed same digest as :latest
#     that day (Trivy 0.74.0, the current stable release at pin time)
#
# Neither scanner image is ever mounted the Docker socket, and both scan
# an exported image archive (`docker save`), never the live daemon - see
# docs/supply-chain.md.

SYFT_IMAGE=anchore/syft:v1.51.0@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0
