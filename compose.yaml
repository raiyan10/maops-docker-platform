# Day 1 baseline: exactly one application service. Deliberately kept
# simple so it can grow through Day 2+ (see docs/roadmap.md) without
# needing a structural rewrite.
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: maops-docker-platform:0.1.0
    container_name: maops-docker-platform-app
    ports:
      - "8080:8080"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      APP_NAME: "maops-docker-platform"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
