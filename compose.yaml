# Day 3 baseline: three Compose-managed services across two explicit
# networks, one named persistent volume, and one Compose config object.
#
# Topology: host -> gateway -> app -> state.
#   - `edge`    : gateway <-> app only.
#   - `backend` : app <-> state only, `internal: true` (no default route
#                 to the outside world, and Docker refuses to attach a
#                 host-published port to a service reachable only via an
#                 internal network).
#   - `gateway` and `state` share NO network - this is what makes
#     gateway -> state unresolvable/unreachable, not merely undeclared.
# See docs/networking.md for the full topology rationale and the runtime
# proof that this is real segmentation, not just two network names.
#
# Persistence: `state` is the only service with a volume mount
# (`state_data:/data`) and keeps `read_only: true` on its own rootfs -
# only /data is writable, via the named volume, never the container
# filesystem itself. See docs/persistence.md.
#
# Configuration: all three services mount the same non-secret
# `config/platform.json` read-only via the top-level `configs:` object
# (Compose-native config injection, distinct from `environment:` and from
# a Compose `secrets:` block, which this platform still has no need for -
# see docs/configuration.md).
#
# No `container_name:` is set for any service (unchanged from Day 2) so
# that scripts/compose/compose_integration.py can bring up multiple
# isolated stacks under distinct `-p <project>` names without a
# fixed-name collision.
services:
  state:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        VERSION: ${VERSION:-0.4.0}
    image: maops-docker-platform:${VERSION:-0.4.0}
    command: ["-m", "state"]
    environment:
      STATE_HOST: "0.0.0.0"
      STATE_PORT: "8080"
    networks:
      - backend
    volumes:
      - type: volume
        source: state_data
        target: /data
    configs:
      - source: platform
        target: /etc/maops/platform.json
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-m", "state.healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        VERSION: ${VERSION:-0.4.0}
    image: maops-docker-platform:${VERSION:-0.4.0}
    command: ["-m", "app"]
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      APP_NAME: "maops-docker-platform"
      STATE_HOST: "state"
      STATE_PORT: "8080"
    networks:
      - edge
      - backend
    configs:
      - source: platform
        target: /etc/maops/platform.json
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      state:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        VERSION: ${VERSION:-0.4.0}
    image: maops-docker-platform:${VERSION:-0.4.0}
    command: ["-m", "gateway"]
    # Sole host-published service, and only on loopback -- never a public
    # 0.0.0.0 bind. GATEWAY_HOST_PORT lets an automated harness (or a
    # developer avoiding a local port conflict) choose the host-side port
    # without editing this file; it defaults to 8080 for everyday
    # `docker compose up -d` use.
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      UPSTREAM_HOST: "app"
      UPSTREAM_PORT: "8080"
    networks:
      - edge
    configs:
      - source: platform
        target: /etc/maops/platform.json
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-m", "gateway.healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy

networks:
  edge: {}
  backend:
    internal: true

volumes:
  state_data: {}

configs:
  platform:
    file: ./config/platform.json
